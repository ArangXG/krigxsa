name: Build & Push Docker

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # tiap hari jam 06:00 UTC, cek update krig-miner terbaru
  workflow_dispatch: {}    # bisa dipicu manual dari tab Actions kalau mau cek sekarang

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            CACHEBUST=${{ github.run_id }}
          tags: |
            tarxg/krigxsa:latest
            tarxg/krigxsa:v1
